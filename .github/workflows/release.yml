name: Release

on:
  # Triggers on merge/push to prod branch
  push:
    branches: [prod]

  # Triggers when a GitHub Release is published
  release:
    types: [published]

  # Allow manual trigger for emergency releases
  workflow_dispatch:
    inputs:
      skip_npm:
        description: 'Skip npm publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prod

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "Computed release tag: $RELEASE_TAG"

      - name: Run validation
        run: pnpm run validate

      - name: Build production with fresh docs
        run: pnpm run build:prod
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Publish to npm
        if: ${{ github.event.inputs.skip_npm != 'true' }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "mcmodding-mcp@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
            echo "⏭️  mcmodding-mcp@$VERSION already published — skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Index and prepare mappings
        run: |
          echo "📋 Indexing Parchment mappings..."
          pnpm run index-mappings:force

          echo "📋 Generating mappings manifest..."
          pnpm run mappings:manifest -- --bump patch --changelog "Release $RELEASE_TAG"

          # Log the new mappings version
          MAPPINGS_VERSION=$(node -p "require('./data/parchment-mappings-manifest.json').version")
          echo "Generated Mappings Manifest Version: $MAPPINGS_VERSION"

      - name: Prepare database release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-artifacts

          # Parchment mappings are always available from the indexing step above.
          cp data/parchment-mappings.db release-artifacts/
          cp data/parchment-mappings-manifest.json release-artifacts/parchment-mappings-manifest.json
          zstd --ultra -20 -T0 --long=29 release-artifacts/parchment-mappings.db -o release-artifacts/parchment-mappings.db.zst

          echo "🔍 Finding previous release with mcmodding-docs.db asset..."
          # gh api --jq does not support --arg; pipe to jq directly.
          PREV_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" | \
            jq -r --arg cur "$RELEASE_TAG" \
            '[.[] | select(.tag_name != $cur) | select(.assets | any(.name == "mcmodding-docs.db"))] | .[0].tag_name // empty' \
            2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            echo "📥 Downloading mcmodding-docs.db from release: $PREV_TAG"
            gh release download "$PREV_TAG" \
              --pattern "mcmodding-docs.db" \
              --output ./data/mcmodding-docs.db \
              --clobber
          else
            echo "⚠️  No previous release found."
          fi

          if [ ! -f ./data/mcmodding-docs.db ]; then
            echo "🔨 Building documentation database index..."
            pnpm run index-docs -- --sitemap
          fi

          echo "Downloaded/Prepared: $(ls -lh ./data/mcmodding-docs.db)"

          echo "📋 Generating manifest with --db-path ./data/mcmodding-docs.db ..."
          pnpm run db:manifest -- \
            --bump patch \
            --changelog "Release $RELEASE_TAG" \
            --release-tag "$RELEASE_TAG" \
            --db-path ./data/mcmodding-docs.db

          # Hard verification: fail CI if the manifest hash does not match the DB
          DB_HASH=$(sha256sum ./data/mcmodding-docs.db | cut -d' ' -f1)
          MANIFEST_HASH=$(node -p "require('./data/db-manifest.json').hash")
          if [ "$DB_HASH" != "$MANIFEST_HASH" ]; then
            echo "ERROR: manifest hash does not match DB: $DB_HASH != $MANIFEST_HASH"
            exit 1
          fi
          echo "✅ Hash verified: $DB_HASH"

          DB_VERSION=$(node -p "require('./data/db-manifest.json').version")
          echo "Generated DB Manifest Version: $DB_VERSION"

          cp ./data/mcmodding-docs.db release-artifacts/mcmodding-docs.db
          cp data/db-manifest.json release-artifacts/db-manifest.json
          zstd --ultra -20 -T0 --long=29 release-artifacts/mcmodding-docs.db -o release-artifacts/mcmodding-docs.db.zst

          echo "📦 Release artifacts:"
          ls -lh release-artifacts/

      - name: Upload database to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            release-artifacts/mcmodding-docs.db
            release-artifacts/mcmodding-docs.db.zst
            release-artifacts/db-manifest.json
            release-artifacts/parchment-mappings.db
            release-artifacts/parchment-mappings.db.zst
            release-artifacts/parchment-mappings-manifest.json
          append_body: true
          body: |

            ---

            ## 🗄️ Database Release

            | File | Description |
            |------|-------------|
            | `mcmodding-docs.db` | Complete documentation index with semantic embeddings |
            | `mcmodding-docs.db.zst` | ZSTD compressed documentation index |
            | `db-manifest.json` | Version manifest with SHA256 hash verification |
            | `parchment-mappings.db` | Parchment mappings database for Minecraft class/method names |
            | `parchment-mappings.db.zst` | ZSTD compressed Parchment mappings database |
            | `parchment-mappings-manifest.json` | Mappings version manifest with SHA256 hash verification |

            **Auto-Update:** The MCP will automatically detect and stream-download these compressed databases on next startup.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log release summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DB_VERSION=$(node -p "try{require('./data/db-manifest.json').version}catch(e){'N/A'}")
          MAPPINGS_VERSION=$(node -p "try{require('./data/parchment-mappings-manifest.json').version}catch(e){'N/A'}")
          echo "## 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package Version | \`v$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Version | \`v$DB_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mappings Version | \`v$MAPPINGS_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | ✅ Published |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ✅ Created |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ✅ Uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "| Mappings | ✅ Uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`mcmodding-docs.db\` / \`mcmodding-docs.db.zst\` - Documentation index" >> $GITHUB_STEP_SUMMARY
          echo "- \`db-manifest.json\` - Documentation version manifest" >> $GITHUB_STEP_SUMMARY
          echo "- \`parchment-mappings.db\` / \`parchment-mappings.db.zst\` - Parchment mappings database" >> $GITHUB_STEP_SUMMARY
          echo "- \`parchment-mappings-manifest.json\` - Mappings version manifest" >> $GITHUB_STEP_SUMMARY

  # Sync prod back to dev after release
  sync-to-dev:
    name: Sync to Dev
    runs-on: ubuntu-latest
    needs: publish
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prod
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create sync PR to dev
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync prod to dev after release'
          title: 'chore: sync release changes back to dev'
          body: |
            ## 🔄 Post-Release Sync

            This PR syncs the release changes from `prod` back to `dev`:
            - Updated `package.json` version
            - Updated `CHANGELOG.md`
            - Updated `.release-please-manifest.json`
            - Updated `data/mcmodding-docs.db` (via Git LFS)
            - Updated `data/db-manifest.json`
            - Updated `data/parchment-mappings.db` (via Git LFS)
            - Updated `data/parchment-mappings-manifest.json`

            **Auto-merge recommended** to keep branches in sync.
          branch: sync/prod-to-dev
          base: dev
          delete-branch: true
          labels: 'sync,automated'
