name: Release

on:
  # Triggers when release-please creates a release
  release:
    types: [published]

  # Allow manual trigger for emergency releases
  workflow_dispatch:
    inputs:
      skip_npm:
        description: 'Skip npm publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prod

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run validation
        run: pnpm run validate

      - name: Build production with fresh docs
        run: pnpm run build:prod
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Publish to npm
        if: ${{ github.event.inputs.skip_npm != 'true' }}
        run: npm publish --provenance --access public --no-git-checks

      - name: Index and prepare mappings
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "📋 Indexing Parchment mappings..."
          pnpm run index-mappings:force

          echo "📋 Generating mappings manifest..."
          pnpm run mappings:manifest -- --bump patch --changelog "Release $RELEASE_TAG"

          # Log the new mappings version
          MAPPINGS_VERSION=$(node -p "require('./data/parchment-mappings-manifest.json').version")
          echo "Generated Mappings Manifest Version: $MAPPINGS_VERSION"

      - name: Prepare database release artifacts
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Get the shared data directory path (where postinstall downloaded the docs DB)
          DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}/mcmodding-mcp"
          echo "Using shared data directory: $DATA_DIR"
          ls -lh "$DATA_DIR/" || echo "Warning: Shared data directory contents not found"

          mkdir -p release-artifacts

          # STEP 1: Copy the DB file FIRST so the manifest is generated from the
          # exact same bytes that will be uploaded. This prevents any divergence
          # between the hashed file and the uploaded file.
          echo "Copying docs database..."
          cp "$DATA_DIR/mcmodding-docs.db" release-artifacts/mcmodding-docs.db

          # STEP 2: Generate manifest by hashing release-artifacts/mcmodding-docs.db
          # directly (via --db-path). This guarantees hash/size in the manifest
          # match the file we are about to upload — no intermediate file swaps possible.
          echo "Generating database manifest from release artifact..."
          pnpm run db:manifest -- --bump patch \
            --changelog "Release $RELEASE_TAG" \
            --release-tag "$RELEASE_TAG" \
            --db-path ./release-artifacts/mcmodding-docs.db

          # Log the new DB version
          DB_VERSION=$(node -p "require('./data/db-manifest.json').version")
          echo "Generated DB Manifest Version: $DB_VERSION"

          # Copy the generated manifest into release-artifacts
          cp data/db-manifest.json release-artifacts/db-manifest.json

          # STEP 3: Verify hash consistency before uploading.
          # If this fails the release job fails loudly rather than publishing
          # a broken manifest/DB pair.
          echo "Verifying manifest hash matches release artifact..."
          EXPECTED_HASH=$(node -p "require('./release-artifacts/db-manifest.json').hash")
          ACTUAL_HASH=$(sha256sum release-artifacts/mcmodding-docs.db | awk '{print $1}')
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "ERROR: Hash mismatch!"
            echo "  Manifest: $EXPECTED_HASH"
            echo "  Actual:   $ACTUAL_HASH"
            exit 1
          fi
          echo "Hash verified: $ACTUAL_HASH"

          # Parchment mappings - from ./data/ (where index-mappings created it)
          cp data/parchment-mappings.db release-artifacts/
          cp data/parchment-mappings-manifest.json release-artifacts/parchment-mappings-manifest.json

          echo "📦 Release artifacts:"
          ls -lh release-artifacts/

      - name: Upload database to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name || format('v{0}', env.VERSION) }}
          files: |
            release-artifacts/mcmodding-docs.db
            release-artifacts/db-manifest.json
            release-artifacts/parchment-mappings.db
            release-artifacts/parchment-mappings-manifest.json
          append_body: true
          body: |

            ---

            ## 🗄️ Database Release

            | File | Description |
            |------|-------------|
            | `mcmodding-docs.db` | Complete documentation index with semantic embeddings |
            | `db-manifest.json` | Version manifest with SHA256 hash verification |
            | `parchment-mappings.db` | Parchment mappings database for Minecraft class/method names |
            | `parchment-mappings-manifest.json` | Mappings version manifest with SHA256 hash verification |

            **Auto-Update:** The MCP will automatically detect and download these databases on next startup.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}

      - name: Log release summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DB_VERSION=$(node -p "require('./data/db-manifest.json').version")
          MAPPINGS_VERSION=$(node -p "require('./data/parchment-mappings-manifest.json').version")
          echo "## 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Package Version | \`v$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Database Version | \`v$DB_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Mappings Version | \`v$MAPPINGS_VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | ✅ Published |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ✅ Created |" >> $GITHUB_STEP_SUMMARY
          echo "| Database | ✅ Uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "| Mappings | ✅ Uploaded |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- \`mcmodding-docs.db\` - Documentation index" >> $GITHUB_STEP_SUMMARY
          echo "- \`db-manifest.json\` - Documentation version manifest" >> $GITHUB_STEP_SUMMARY
          echo "- \`parchment-mappings.db\` - Parchment mappings database" >> $GITHUB_STEP_SUMMARY
          echo "- \`parchment-mappings-manifest.json\` - Mappings version manifest" >> $GITHUB_STEP_SUMMARY

  # Sync prod back to dev after release
  sync-to-dev:
    name: Sync to Dev
    runs-on: ubuntu-latest
    needs: publish
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: prod
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create sync PR to dev
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: sync prod to dev after release'
          title: 'chore: sync release changes back to dev'
          body: |
            ## 🔄 Post-Release Sync

            This PR syncs the release changes from `prod` back to `dev`:
            - Updated `package.json` version
            - Updated `CHANGELOG.md`
            - Updated `.release-please-manifest.json`
            - Updated `data/mcmodding-docs.db` (via Git LFS)
            - Updated `data/db-manifest.json`
            - Updated `data/parchment-mappings.db` (via Git LFS)
            - Updated `data/parchment-mappings-manifest.json`

            **Auto-merge recommended** to keep branches in sync.
          branch: sync/prod-to-dev
          base: dev
          delete-branch: true
          labels: 'sync,automated'
