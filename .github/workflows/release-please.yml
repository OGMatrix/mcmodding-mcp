name: Release Please

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Create/Update Release PR
    runs-on: ubuntu-latest

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: prod

      - name: Log release-please output
        env:
          PR: ${{ steps.release.outputs.pr }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "## Release Please Output" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ -n "$PR" ]]; then
            # Try to extract number if it's JSON, otherwise use raw value
            PR_NUMBER=$(echo "$PR" | jq -r .number 2>/dev/null || echo "$PR")
            if [[ "$PR_NUMBER" == "null" ]]; then PR_NUMBER="$PR"; fi
            echo "📋 **PR Created/Updated:** #$PR_NUMBER" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$RELEASE_CREATED" == "true" ]]; then
            echo "🎉 **Release Created:** v$VERSION" >> $GITHUB_STEP_SUMMARY
            echo "🏷️ **Tag:** $TAG_NAME" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No release created (PR pending merge to prod)" >> $GITHUB_STEP_SUMMARY
          fi
