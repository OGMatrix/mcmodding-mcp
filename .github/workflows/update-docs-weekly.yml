name: Weekly Documentation Update

on:
  schedule:
    # Run every Sunday at 2:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Documentation Index
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Increased timeout for full re-index including mappings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev # Checkout dev branch to commit changes later
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Latest Release Tag
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "Latest release tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════════
      # DOCUMENTATION DATABASE
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Re-index Documentation (Full Rebuild)
        run: |
          # Remove existing database to ensure a fresh index
          rm -f data/mcmodding-docs.db

          # Run full index (no incremental flag)
          pnpm run index-docs -- --sitemap --embeddings
        env:
          # Allow longer timeout and more memory for embedding generation
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate Documentation Database Manifest
        run: |
          # STEP 1: Copy the freshly-indexed DB into release-artifacts so the
          # manifest is hashed from the exact file that will be uploaded.
          mkdir -p release-artifacts
          cp data/mcmodding-docs.db release-artifacts/mcmodding-docs.db

          # STEP 2: Generate manifest from the copied file via --db-path.
          # This guarantees hash/size in db-manifest.json match the upload.
          pnpm run db:manifest -- --bump patch \
            --changelog "Weekly update for $LATEST_TAG" \
            --release-tag "$LATEST_TAG" \
            --db-path ./release-artifacts/mcmodding-docs.db

          # STEP 3: Verify consistency before uploading.
          EXPECTED_HASH=$(node -p "require('./data/db-manifest.json').hash")
          ACTUAL_HASH=$(sha256sum release-artifacts/mcmodding-docs.db | awk '{print $1}')
          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "ERROR: Hash mismatch!"
            echo "  Manifest: $EXPECTED_HASH"
            echo "  Actual:   $ACTUAL_HASH"
            exit 1
          fi
          echo "Hash verified: $ACTUAL_HASH"

          cp data/db-manifest.json release-artifacts/db-manifest.json
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.tag }}

      # ═══════════════════════════════════════════════════════════════════════════
      # PARCHMENT MAPPINGS DATABASE
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Re-index Parchment Mappings (Full Rebuild)
        run: |
          # Remove existing database to ensure a fresh index
          rm -f data/parchment-mappings.db

          # Run full mappings index with force flag
          pnpm run index-mappings:force
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate Mappings Database Manifest
        run: |
          # Generate mappings manifest with a patch bump
          pnpm run mappings:manifest -- --bump patch --changelog "Weekly mappings update for $LATEST_TAG"
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.tag }}

      # ═══════════════════════════════════════════════════════════════════════════
      # UPLOAD AND COMMIT
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Update Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_release.outputs.tag }}
        run: |
          echo "Uploading database assets to release $TAG..."
          # Upload documentation database from release-artifacts (hash-verified)
          gh release upload "$TAG" release-artifacts/mcmodding-docs.db release-artifacts/db-manifest.json --clobber
          # Upload mappings database
          gh release upload "$TAG" data/parchment-mappings.db data/parchment-mappings-manifest.json --clobber

      - name: Log summary
        if: always()
        run: |
          echo "## Weekly Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation Database" >> $GITHUB_STEP_SUMMARY
          echo "✅ Full re-index completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Parchment Mappings Database" >> $GITHUB_STEP_SUMMARY
          echo "✅ Full mappings re-index completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "✅ Database assets updated in release ${{ steps.get_release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Changes committed to dev branch" >> $GITHUB_STEP_SUMMARY
