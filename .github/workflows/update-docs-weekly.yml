name: Weekly Documentation Update

on:
  schedule:
    # Run every Sunday at 2:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Documentation Index
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Increased timeout for full re-index including mappings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev # Checkout dev branch to commit changes later
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Latest Release Tag
        id: get_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "Latest release tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      # ═══════════════════════════════════════════════════════════════════════════
      # DOCUMENTATION DATABASE
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Re-index Documentation (Full Rebuild)
        run: |
          # Remove existing database to ensure a fresh index
          rm -f data/mcmodding-docs.db

          # Run full index (no incremental flag)
          pnpm run index-docs -- --sitemap --embeddings
        env:
          # Allow longer timeout and more memory for embedding generation
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate Documentation Database Manifest
        run: |
          # Generate manifest from the EXACT file we just indexed.
          # --db-path ensures the hash is computed from ./data/mcmodding-docs.db,
          # not from ~/.local/share/mcmodding-mcp/ (postinstall's stale copy).
          pnpm run db:manifest -- --bump patch --changelog "Weekly update for $LATEST_TAG" --release-tag "$LATEST_TAG" --db-path ./data/mcmodding-docs.db

          # Verify: sha256 of the indexed DB must match what we just wrote into the manifest
          DB_HASH=$(sha256sum ./data/mcmodding-docs.db | cut -d' ' -f1)
          MANIFEST_HASH=$(node -p "require('./data/db-manifest.json').hash")
          if [ "$DB_HASH" != "$MANIFEST_HASH" ]; then
            echo "ERROR: manifest hash does not match indexed DB: $DB_HASH != $MANIFEST_HASH"
            exit 1
          fi
          echo "Hash verified: $DB_HASH"
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.tag }}

      # ═══════════════════════════════════════════════════════════════════════════
      # PARCHMENT MAPPINGS DATABASE
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Re-index Parchment Mappings (Full Rebuild)
        run: |
          # Remove existing database to ensure a fresh index
          rm -f data/parchment-mappings.db

          # Run full mappings index with force flag
          pnpm run index-mappings:force
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Generate Mappings Database Manifest
        run: |
          # Generate mappings manifest with a patch bump
          pnpm run mappings:manifest -- --bump patch --changelog "Weekly mappings update for $LATEST_TAG"
        env:
          LATEST_TAG: ${{ steps.get_release.outputs.tag }}

      # ═══════════════════════════════════════════════════════════════════════════
      # UPLOAD AND COMMIT
      # ═══════════════════════════════════════════════════════════════════════════

      - name: Compress Database Assets
        run: |
          echo "Compressing database assets with zstd..."
          zstd --ultra -20 -T0 --long=29 data/mcmodding-docs.db -o data/mcmodding-docs.db.zst
          zstd --ultra -20 -T0 --long=29 data/parchment-mappings.db -o data/parchment-mappings.db.zst
          echo "Docs DB compressed: $(ls -lh data/mcmodding-docs.db.zst)"
          echo "Mappings DB compressed: $(ls -lh data/parchment-mappings.db.zst)"

      - name: Update Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_release.outputs.tag }}
        run: |
          echo "Uploading database assets to release $TAG..."
          # Upload documentation database
          gh release upload "$TAG" data/mcmodding-docs.db data/mcmodding-docs.db.zst data/db-manifest.json --clobber
          # Upload mappings database
          gh release upload "$TAG" data/parchment-mappings.db data/parchment-mappings.db.zst data/parchment-mappings-manifest.json --clobber

      - name: Log summary
        if: always()
        run: |
          echo "## Weekly Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Documentation Database" >> $GITHUB_STEP_SUMMARY
          echo "✅ Full re-index completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Parchment Mappings Database" >> $GITHUB_STEP_SUMMARY
          echo "✅ Full mappings re-index completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "✅ Database assets updated in release ${{ steps.get_release.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Changes committed to dev branch" >> $GITHUB_STEP_SUMMARY
